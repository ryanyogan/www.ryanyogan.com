name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# One run per ref at a time. A newer push to a pull request cancels the run in progress. A
# run on master is never cancelled once it has started (it may be halfway through a deploy):
# a newer push waits for it, and of several waiting only the newest is kept, so master
# deploys one commit at a time, in push order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # package.json "engines" asks for Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      # Before typecheck: src/routeTree.gen.ts is git-ignored and the build generates it.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # JWT verification, the admin guard and write validation; a locally generated key pair.
      - name: Unit tests
        run: pnpm test

      # This checkout is a fresh clone: no local database yet. `pnpm dev` must migrate and
      # seed it by itself and serve / and /projects with the 17 projects (a few seconds).
      - name: Fresh clone dev check
        run: sh scripts/fresh-clone-check.sh --in-place

      # The browser downloads, kept between runs. The key changes with the lockfile, so a new
      # Playwright version downloads its own builds. The system packages are not cached: the
      # install step below still runs apt for them.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium for the whole suite, WebKit for the "webkit" project (public pages at iPhone
      # size). A browser already in the cache is not downloaded again.
      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium webkit

      # The same command as locally. It migrates and seeds throwaway local D1 databases
      # (miniflare, under apps/web/.wrangler; no account, token or --remote), runs Playwright
      # against the build above with local stubs for GitHub and Workers AI, exits non-zero on
      # any failed test, and writes the totals to the job summary.
      - name: End-to-end tests
        run: pnpm test:e2e

      # What each public page type downloads from the build above, gzip, against the budgets
      # in apps/web/scripts/perf-budget.mjs. Also fails if a public page fetches the markdown
      # parser, the highlighter or another post's body.
      - name: Transfer budget
        run: pnpm perf:budget

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e-results.json
          if-no-files-found: ignore
          retention-days: 7

  # Production (the Worker `ryanyogan-com`, https://ryanyogan.com): only for a push to master
  # in this repository, never a pull request or a fork, and only after `validate` passed for
  # the same commit. See "Deploy from CI" in the README.
  deploy:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'ryanyogan/www.ryanyogan.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own group as well: whatever starts another run, a deploy is never cancelled halfway
    # and two never overlap.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: apps/web
    steps:
      # github.sha: the commit `validate` just checked, not whatever master points at by now.
      - uses: actions/checkout@v4

      # Before anything is installed or changed. Only the names are printed, never a value.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy credentials missing::Repository secret(s) not set:$missing. Nothing was migrated or deployed. Add them (README, Deploy from CI) and re-run this job."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the database is touched, so a build that fails leaves production as it was.
      # No credentials here: the build reaches nothing remote.
      - name: Build
        run: pnpm build

      # Read-only: fails here, with nothing changed, when the token is wrong, expired or for
      # another account.
      - name: Check Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deployments status

      # Before the deploy: the new code may read a table the old schema does not have (the
      # admin's delete writes `deleted_seed_slugs`, and the seed below reads it). Wrangler
      # skips its confirmation when there is no terminal; with nothing pending it is a no-op.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote

      # content/projects/*.md into D1. Safe on every deploy (scripts/seed-projects.ts): it
      # only writes a row that is still an untouched seed row and whose file changed, never
      # changes `published`, and skips slugs deleted or renamed in /admin.
      - name: Seed projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm db:seed:generate
          pnpm exec wrangler d1 execute DB --remote --yes --file db/seed.sql

      # The build above, to the Worker named in wrangler.jsonc. The custom domain and the
      # Worker's secrets (ADMIN_EMAIL) are not in the config and a deploy leaves them alone.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "CI ${GITHUB_SHA}"

      # /, /projects and /sitemap.xml must answer 200 and / must name this build's hashed
      # entry script and stylesheet; 6 tries, 10 seconds apart. A failure here means the new
      # version is live and wrong: roll back (README, Roll back).
      - name: Smoke check
        working-directory: .
        run: sh scripts/deploy-smoke.sh https://ryanyogan.com

      - name: Summary
        run: echo "Deployed \`${GITHUB_SHA}\` to https://ryanyogan.com" >> "$GITHUB_STEP_SUMMARY"
