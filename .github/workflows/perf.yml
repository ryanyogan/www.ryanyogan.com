name: Performance

# Lighthouse against the section 1.9 budgets (apps/web/scripts/perf.mjs). A report, not a
# gate: it never runs on a push, is not a required check, and a line over budget does not fail
# the run. No secrets: it reads the public site, or builds and serves this ref locally.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to measure, e.g. https://ryanyogan.com. Empty: build this ref and measure its local preview."
        required: false
        default: ""
      applied:
        description: "Throttle for real (Chrome's network and CPU throttling) instead of simulating. For diagnosis."
        type: boolean
        default: false
  # Mondays 06:17 UTC, against production.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      BASE_URL: ${{ github.event_name == 'schedule' && 'https://ryanyogan.com' || inputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the local preview needs the workspace installed and built; measuring a deployed
      # site needs the script and Lighthouse alone.
      - name: Install dependencies
        if: ${{ env.BASE_URL == '' }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ env.BASE_URL == '' }}
        run: pnpm build

      # The runner's own Google Chrome; Lighthouse (the version pinned in perf.mjs) is
      # fetched here so the time that takes shows on its own line.
      - name: Fetch Lighthouse
        run: |
          google-chrome --version
          pnpm dlx lighthouse@13.5.0 --version

      # --detail: the request table, LCP breakdown and request chain per page, in the summary
      # and as JSON in the artifact.
      - name: Lighthouse
        run: pnpm perf "$BASE_URL" --detail ${{ inputs.applied && '--applied' || '' }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: perf-detail
          path: apps/web/perf-detail
          if-no-files-found: ignore
